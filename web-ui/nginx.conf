# web-ui/nginx.conf
events {}

http {

  server {
    listen 80;
    server_name _;

    # Use Docker’s embedded DNS to resolve service names at request time
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Serve the SPA from here
    root /usr/share/nginx/html;
    index index.html;

    # Serve actual files directly (prevents index.html recursion)
    location = /index.html { try_files /index.html =404; }
    location = /styles.css { try_files /styles.css =404; }
    location = /favicon.ico { try_files /favicon.ico =404; }

    # SPA fallback: if it’s not a real file/dir, return index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API proxies
    location /api/products/ { proxy_set_header Host $host; proxy_pass http://products:8001/; }
    location /api/carts/    { proxy_set_header Host $host; proxy_pass http://carts:8002/; }
    location /api/orders/   { proxy_set_header Host $host; proxy_pass http://orders:8004/; }
    location /api/users/    { proxy_set_header Host $host; proxy_pass http://users:8015/; }
  }
}
